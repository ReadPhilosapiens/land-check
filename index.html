<style>
:root{--nav:rgba(17,20,24,.96);--bg:#111418;--card:#1a1e24;--line:#2a3038;--tx:#e8eaed;--mu:#8b939c;--ok:#78be96;--warn:#e0b25c;--bad:#e07a6e;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 88px);min-height:100vh;overscroll-behavior:none}
h1{font-size:22px;margin:4px 0 16px;font-weight:600}
h2{font-size:14px;color:var(--mu);font-weight:500;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{display:none}.scr.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.big{font-size:64px;font-weight:600;line-height:1;margin:6px 0}
.mu{color:var(--mu);font-size:15px}
.main{display:block;width:100%;min-height:72px;border-radius:var(--r);background:var(--ok);color:#0d1a12;font-size:21px;font-weight:600;margin:16px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{min-height:56px;border-radius:14px;background:var(--line);font-size:17px;padding:0 12px}
.btn.g{background:var(--ok);color:#0d1a12;font-weight:600}
.btn.s{background:transparent;border:1px solid var(--line);color:var(--mu);min-height:48px;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;background:none;color:var(--mu);font-size:15px}
nav button.on{color:var(--tx);font-weight:600}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none}
.sheet.on{display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x{min-width:56px;min-height:48px;background:var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{min-height:52px;background:var(--card);border-radius:12px;padding:6px 10px;text-align:left;font-size:16px}
.grid button i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
input[type=search]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;padding:0 14px;margin-bottom:4px}
.v{font-size:34px;font-weight:700;margin:4px 0 2px}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.bad{color:var(--bad)}.v.n{color:var(--tx)}
.ln{padding:6px 0;border-top:1px solid var(--line)}.ln:first-of-type{border:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border:0}
.tag{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.sc{font-weight:600;font-variant-numeric:tabular-nums}
.d{margin:16px 0 4px;color:var(--mu);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.link{background:none;color:var(--mu);text-decoration:underline;font-size:14px;min-height:44px;padding:0}

/* ---------- Neumorphism: soft extruded surfaces ---------- */
[data-t=neu]{--bg:#262a31;--card:#262a31;--line:#30353d;--nav:#262a31;--tx:#e3e6ea;--mu:#9099a3;--r:22px;--hi:#30353e;--lo:#1c1f24}
[data-t=neu] .card,[data-t=neu] .grid button{box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi)}
[data-t=neu] .btn,[data-t=neu] .x,[data-t=neu] .main{background:var(--bg);box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);border-radius:18px}
[data-t=neu] .main{color:var(--ok);font-size:22px}
[data-t=neu] .btn.g{color:var(--ok);background:var(--bg)}
[data-t=neu] .btn.s{border:0;box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
[data-t=neu] .btn:active,[data-t=neu] .main:active,[data-t=neu] .x:active,[data-t=neu] .grid button:active{box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
[data-t=neu] input[type=search]{border:0;background:var(--bg);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);border-radius:16px}
[data-t=neu] .tag{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
[data-t=neu] .it,[data-t=neu] .ln{border-color:transparent}
[data-t=neu] nav{border:0;box-shadow:0 -6px 14px var(--lo)}
[data-t=neu] .big{text-shadow:3px 3px 6px var(--lo),-2px -2px 4px var(--hi)}
/* ---------- Brutalism: raw, hard edges, loud ---------- */
[data-t=bru]{--bg:#0b0b0b;--card:#0b0b0b;--line:#f2f2f2;--nav:#0b0b0b;--tx:#f2f2f2;--mu:#bdbdbd;--ok:#3dff8b;--warn:#ffe600;--bad:#ff4d3d;--r:0;--y:#ffe600}
[data-t=bru],[data-t=bru] body,[data-t=bru] button,[data-t=bru] input{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-t=bru] h1{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
[data-t=bru] h2{color:var(--tx);font-weight:800}
[data-t=bru] .card{border:3px solid var(--line);box-shadow:6px 6px 0 var(--y)}
[data-t=bru] .big{font-size:80px;font-weight:900}
[data-t=bru] .main{background:var(--y);color:#000;border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);text-transform:uppercase;font-weight:900;letter-spacing:.04em}
[data-t=bru] .main:active,[data-t=bru] .btn:active,[data-t=bru] .grid button:active{transform:translate(4px,4px);box-shadow:none}
[data-t=bru] .btn,[data-t=bru] .x{background:var(--bg);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);font-weight:700;border-radius:0}
[data-t=bru] .btn.g{background:var(--y);color:#000}
[data-t=bru] .btn.s{color:var(--tx);box-shadow:none}
[data-t=bru] .grid button{border:2px solid var(--line);border-radius:0;box-shadow:3px 3px 0 var(--line)}
[data-t=bru] input[type=search]{border:3px solid var(--line);border-radius:0;background:var(--bg)}
[data-t=bru] .tag{border-radius:0;border:2px solid currentColor;background:none;font-weight:700;text-transform:uppercase}
[data-t=bru] .it,[data-t=bru] .ln{border-top:2px dashed var(--line)}
[data-t=bru] .it:first-child,[data-t=bru] .ln:first-of-type{border-top:0}
[data-t=bru] .row .btn{font-size:15px;padding:0 6px}
[data-t=bru] .v{text-transform:uppercase;font-weight:900}
[data-t=bru] nav{border-top:3px solid var(--line)}
[data-t=bru] nav button.on{background:var(--y);color:#000;font-weight:900}
[data-t=bru] .toast{border-radius:0;background:var(--y);color:#000;font-weight:700}
/* ---------- Minimalism: almost nothing ---------- */
[data-t=min]{--bg:#0e0f11;--card:transparent;--line:#202226;--nav:#0e0f11;--tx:#ececec;--mu:#7d8187;--r:0}
[data-t=min] h1{font-weight:300;font-size:24px;letter-spacing:.01em}
[data-t=min] h2{font-weight:400;letter-spacing:.12em;font-size:12px}
[data-t=min] .card{padding:16px 0;border-bottom:1px solid var(--line)}
[data-t=min] .big{font-weight:200;font-size:88px}
[data-t=min] .main{background:none;border:1px solid var(--tx);color:var(--tx);font-weight:400;font-size:19px;letter-spacing:.06em;border-radius:99px}
[data-t=min] .btn{background:none;border:1px solid var(--line);font-weight:400;border-radius:99px}
[data-t=min] .btn.g{background:none;color:var(--ok);border-color:var(--ok)}
[data-t=min] .x{background:none;border:1px solid var(--line);border-radius:99px}
[data-t=min] .grid button{background:none;border-bottom:1px solid var(--line);border-radius:0}
[data-t=min] input[type=search]{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0}
[data-t=min] .tag{background:none;padding:0}
[data-t=min] .v{font-weight:300}
[data-t=min] nav{border-top:1px solid var(--line)}
[data-t=min] nav button.on{font-weight:500}


/* ---------- Glass: frosted panels over a deep gradient ---------- */
[data-t=glass]{--bg:#141824;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--nav:rgba(20,24,36,.55);--tx:#f1f3f8;--mu:#a6aec0;--ok:#7fe0b0;--warn:#f5c86b;--bad:#ff8a80;--r:20px}
[data-t=glass] body{background:transparent}
[data-t=glass] body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 15% 10%,#3a2f7a 0,transparent 70%),radial-gradient(55% 45% at 90% 35%,#0f5a5e 0,transparent 70%),radial-gradient(60% 50% at 40% 95%,#5a2350 0,transparent 70%),#141824}
[data-t=glass] .card,[data-t=glass] .grid button,[data-t=glass] .btn,[data-t=glass] .x,[data-t=glass] .chip{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
[data-t=glass] .main{background:linear-gradient(135deg,rgba(127,224,176,.9),rgba(110,170,255,.85));color:#0b1420;border:1px solid rgba(255,255,255,.35)}
[data-t=glass] .btn.g{background:rgba(127,224,176,.85);color:#0b1420}
[data-t=glass] nav{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
[data-t=glass] .sheet{background:radial-gradient(70% 50% at 20% 0,#2c2560 0,transparent 70%),#141824}
[data-t=glass] input[type=search]{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* ---------- Retro: green-screen terminal ---------- */
[data-t=ret]{--bg:#040904;--card:#040904;--line:#1d4a1d;--nav:#040904;--tx:#86ff86;--mu:#46a846;--ok:#86ff86;--warn:#ffd75f;--bad:#ff6b5f;--r:0}
[data-t=ret],[data-t=ret] body,[data-t=ret] button,[data-t=ret] input{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-t=ret] body{text-shadow:0 0 6px rgba(134,255,134,.35)}
[data-t=ret] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
[data-t=ret] h1::before{content:"> "}
[data-t=ret] .card{border:1px dashed var(--line)}
[data-t=ret] .main{background:none;border:2px solid var(--ok);color:var(--ok);border-radius:0;text-transform:uppercase;letter-spacing:.1em}
[data-t=ret] .main::before{content:"[ "}[data-t=ret] .main::after{content:" ]"}
[data-t=ret] .btn,[data-t=ret] .x,[data-t=ret] .grid button,[data-t=ret] .chip{background:none;border:1px solid var(--line);border-radius:0}
[data-t=ret] .btn.g{border-color:var(--ok);color:var(--ok);background:rgba(134,255,134,.08)}
[data-t=ret] .tag{background:none;border:1px solid currentColor;border-radius:0}
[data-t=ret] input[type=search]{border-radius:0;background:none}
[data-t=ret] nav button.on{text-decoration:underline;text-underline-offset:4px}
[data-t=ret] .toast{border-radius:0;background:var(--ok);color:#000;text-shadow:none}
/* ---------- Day: light, readable in sunlight ---------- */
[data-t=day]{--bg:#f6f4ef;--card:#ffffff;--line:#e2ddd2;--nav:rgba(246,244,239,.97);--tx:#1d1d1b;--mu:#6a675f;--ok:#1f7a4d;--warn:#a8650c;--bad:#b8322a;--r:16px}
[data-t=day] body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#1d1d1b;z-index:40}
[data-t=day] .card{box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
[data-t=day] .main,[data-t=day] .btn.g{color:#fff}
[data-t=day] .grid button,[data-t=day] input[type=search]{border:1px solid var(--line)}
[data-t=day] .toast{background:#1d1d1b;color:#fff}
[data-t=ret] .chip,[data-t=glass] .chip{border-left-width:6px}
/* ---------- Map ---------- */
#map svg{display:block;width:100%;height:auto;touch-action:manipulation}
#map .fc{fill:none;stroke:var(--line);stroke-width:.6}
#map .dc{stroke-width:1;cursor:pointer}
#map .ok{fill:var(--ok);stroke:var(--ok)}#map .warn{fill:var(--warn);stroke:var(--warn)}#map .bad{fill:var(--bad);stroke:var(--bad)}
#map .dc{fill-opacity:.28}#map .dc.sel{fill-opacity:.75;stroke-width:2.4}
#map .lb{font-size:8px;fill:var(--tx);pointer-events:none;font-weight:600}
#map .ax{font-size:8px;fill:var(--mu)}
#map .ba{fill:var(--tx)}#map .bat{font-size:7px;fill:var(--bg);font-weight:700;letter-spacing:.06em}
#map .ar{font-size:8.5px;fill:var(--mu)}
.seg{margin-bottom:10px}.seg .btn{min-height:44px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{min-height:40px;padding:0 12px;border-radius:99px;background:var(--line);font-size:14px;border-left:6px solid var(--mu)}
.chip.ok,[data-t] .chip.ok{border-left-color:var(--ok)}.chip.warn,[data-t] .chip.warn{border-left-color:var(--warn)}.chip.bad,[data-t] .chip.bad{border-left-color:var(--bad)}
.chip.sel{outline:2px solid var(--tx)}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mu);margin:8px 0 2px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#mapInfo:empty{display:none}
[data-t=bru] .chip{border-radius:0;border:2px solid var(--line);border-left-width:8px;background:none;font-weight:700}
[data-t=neu] .chip{background:var(--bg);box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
[data-t=min] .chip{background:none;border:1px solid var(--line);border-left-width:4px}
</style>
<script>try{document.documentElement.dataset.t=localStorage.getItem('landcheck.look')||'neu'}catch(e){document.documentElement.dataset.t='neu'}</script>
</head>
<body>

<section class="scr on" id="today">
  <h1>Land Check</h1>
  <div class="card">
    <div class="mu">Risky deals dodged</div>
    <div class="big" id="dodged">0</div>
    <div class="mu" id="week"></div>
  </div>
  <button class="main" id="go">Check land</button>
  <div id="ask"></div>
  <div id="sampleNote"></div>
</section>

<section class="scr" id="history">
  <h1>History</h1>
  <div class="card" id="hist"></div>
</section>

<section class="scr" id="numbers">
  <h1>Numbers</h1>
  <div class="mu" id="asof"></div>
  <h2>Map</h2>
  <div class="row seg"><button class="btn" data-mc="risk">Risk</button><button class="btn" data-mc="fut">Future</button></div>
  <div class="card" id="map"></div>
  <div class="card" id="mapInfo"></div>
  <h2>Best to invest</h2>
  <div class="card" id="best"></div>
  <h2>Worst to invest</h2>

const KEY = "landcheck.v1";
const $ = id => document.getElementById(id);
const DAY = 864e5;
const byName = Object.fromEntries(AREAS.map(a => [a.n, a]));

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.entries))return d}catch(e){}return null}
let db = load();
function save(){try{localStorage.setItem(KEY, JSON.stringify(db))}catch(e){toast("Could not save")}}

function money(v){return v>=1e7?(v/1e7).toFixed(v>=1e8?0:1)+" cr":Math.round(v/1e5)+" lakh"}
const rng=(lo,hi)=>lo===hi?money(lo):money(lo)+" – "+money(hi);
function priceRows(a){
  const plot = a.pl!=null ? rng(a.pl*225,a.ph*225)+" / marla" : "Rarely sold empty here";
  let house = "No reliable figure";
  if(a.hl!=null){ const mid=(a.hl+a.hh)/2*225;
    house = rng(a.hl*225,a.hh*225)+" / marla"+(a.ha?" (society avg)":"")+`<div class="mu">10-marla house ≈ ${money(mid*10)}</div>`; }
  return `<div class="ln"><span class="mu">Plot only</span><br><b>${plot}</b></div><div class="ln"><span class="mu">Built house</span><br><b>${house}</b></div>`;
}
function verdict(a, mode){
  const y = a.y!=null ? (a.y>=0?"+":"")+a.y+"% in a year" : "No yearly data";
  if(mode==="buy"){
    if(a.l==="risk") return {v:"Avoid",c:"bad",why:"Title or approval problems reported",next:"Walk away, or see a lawyer first",y};
    if(a.l==="verify") return {v:"Check first",c:"warn",why:"Some files or blocks not approved",next:"Get NOC proof. Check the CDA illegal list.",y};
    return {v:"Safe area",c:"ok",why:"Approved area. Seller still needs checking.",next:"Verify transfer at the CDA or society office",y};
  }
  if(a.l==="risk") return {v:"Sell soon",c:"warn",why:"Legal risk weighs on future value",next:"Take bank transfer or pay order only",y};
  if((a.y||0)>=10 && a.l==="ok") return {v:"Hold if you can",c:"ok",why:"Still rising fast",next:"If selling, ask the top of the range",y};
  return {v:"Fair to sell",c:"n",why:"Steady prices here",next:"Take bank transfer or pay order only",y};
}
const isRisky = e => e.m==="buy" && byName[e.n] && byName[e.n].l!=="ok";
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return +d}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),1600)}

/* ---------- render ---------- */
function render(){
  const E = db.entries;
  $("dodged").textContent = E.filter(e=>isRisky(e)&&e.a==="no").length;
  const wk = E.filter(e=>e.t>Date.now()-7*DAY).length;
  const flagged = E.filter(isRisky).length;
  $("week").textContent = wk+" checks this week · "+flagged+" risky flagged";

  // one follow-up question, next day
  const today = startOfDay(Date.now());
  const q = E.filter(e=>(!e.a||(e.a==="wait"&&e.at<today)) && e.t<today).sort((a,b)=>b.t-a.t)[0];
  $("ask").innerHTML = q ? `<div class="card"><div class="mu">${ago(q.t)}</div>
    <div style="font-size:20px;margin:4px 0 14px">Did you ${q.m} in ${q.n}?</div>
    <div class="row"><button class="btn" data-a="yes" data-id="${q.id}">Yes</button><button class="btn" data-a="no" data-id="${q.id}">No</button><button class="btn" data-a="wait" data-id="${q.id}">Not yet</button></div></div>` : "";

  const hasS = E.some(e=>e.s);
  $("sampleNote").innerHTML = hasS ? `<button class="link" id="clr2">Showing sample week · Clear samples</button>` : "";
  $("smp").textContent = hasS ? "Clear samples" : "Load samples";

  // history
  const H = [...E].sort((a,b)=>b.t-a.t);
  $("hist").innerHTML = H.length ? H.map(e=>{
    const a=byName[e.n], v=a?verdict(a,e.m):{v:"?",c:""};
    const out = e.a==="yes"?(e.m==="buy"?"Bought":"Sold"):e.a==="no"?"Didn't":e.a==="wait"?"Not yet":"";
    return `<div class="it"><div><div>${e.n} <span class="mu">· ${e.m==="buy"?"Buy":"Sell"}</span></div>
      <div class="mu">${ago(e.t)}${out?" · "+out:""}</div></div><span class="tag ${v.c}">${v.v}</span></div>`;
  }).join("") : `<div class="mu">No checks yet</div>`;

  // numbers
  $("asof").textContent = "Asking prices, "+DATA_DATE+". Per marla of land.";
  const ranked = AREAS.filter(a=>a.lo).sort((a,b)=>b.s-a.s);
  const li = a => `<div class="it"><div><div>${a.n}</div><div class="mu">${a.r}</div></div><span class="sc">${a.s}</span></div>`;
  drawMap();
  $("best").innerHTML = ranked.slice(0,3).map(li).join("");
  $("worst").innerHTML = ranked.slice(-3).reverse().map(li).join("");
  const buys=E.filter(e=>e.m==="buy").length;
  const yes=E.filter(e=>e.a==="yes").length;
  $("mine").innerHTML = `<div class="it"><span>Checks</span><span class="sc">${E.length}</span></div>
    <div class="it"><span>Buy / Sell</span><span class="sc">${buys} / ${E.length-buys}</span></div>
    <div class="it"><span>Risky flagged</span><span class="sc">${flagged}</span></div>
    <div class="it"><span>Deals done</span><span class="sc">${yes}</span></div>`;
}
function ago(t){
  const d = Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  return d===0?"Today":d===1?"Yesterday":d+" days ago";
}

/* ---------- check flow: 2 inputs ---------- */
let mode=null;
function openPick(){
  mode=null;
  $("pickT").textContent="Buying or selling?";
  $("pickBody").innerHTML=`<div class="row" style="margin-top:30px"><button class="btn g" style="min-height:96px;font-size:22px" data-m="buy">Buy</button><button class="btn" style="min-height:96px;font-size:22px" data-m="sell">Sell</button></div>`;
  $("pick").classList.add("on");
}
function showAreas(){
  $("pickT").textContent = mode==="buy"?"Buy where?":"Sell where?";
  const recent=[...new Set([...db.entries].sort((a,b)=>b.t-a.t).map(e=>e.n))].filter(n=>byName[n]).slice(0,4);
  const groups={};AREAS.forEach(a=>(groups[a.g]=groups[a.g]||[]).push(a));
  const btn=a=>`<button data-n="${a.n}">${a.n}<i>${a.pl!=null?"Plot "+money(a.pl*225):a.hl!=null?"House "+money(a.hl*225):"–"}</i></button>`;
  let h=`<input type="search" id="q" placeholder="Find area" autocomplete="off">`;
  if(recent.length) h+=`<div class="d">Recent</div><div class="grid">${recent.map(n=>btn(byName[n])).join("")}</div>`;
  for(const g in groups) h+=`<div class="d" data-g>${g}</div><div class="grid">${groups[g].map(btn).join("")}</div>`;
  $("pickBody").innerHTML=h;
  $("q").addEventListener("input",e=>{
    const s=e.target.value.toLowerCase();
    $("pickBody").querySelectorAll(".grid button").forEach(b=>b.style.display=b.dataset.n.toLowerCase().includes(s)?"":"none");
  });
}
function check(name){
  const a=byName[name], v=verdict(a,mode);
  db.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),n:name,m:mode});
  save();
  $("pick").classList.remove("on");
  $("resT").textContent=(mode==="buy"?"Buy":"Sell")+" · "+name;
  $("resBody").innerHTML=`<div class="v ${v.c}">${v.v}</div><div class="mu" style="margin-bottom:14px">${v.why}</div>
    ${priceRows(a)}
    <div class="ln">${v.y}</div>
    <div class="ln">${a.k} km from Blue Area</div>
    <div class="ln">Future score <b>${a.s}</b>/100</div>
    <div class="ln" style="color:var(--${v.c==="bad"?"bad":v.c==="warn"?"warn":"tx"})">→ ${v.next}</div>`;
  $("res").classList.add("on");
  render();
}

/* ---------- backup / restore ---------- */
async function backup(){
  const txt=JSON.stringify({app:"landcheck",v:1,saved:new Date().toISOString(),entries:db.entries},null,1);
  const name="land-check-backup-"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([txt],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return} }catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("Backup saved");
}
function restore(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=="landcheck"||!Array.isArray(d.entries)) throw 0;
      const ok=d.entries.filter(e=>e&&e.id&&e.t&&e.n&&(e.m==="buy"||e.m==="sell"));
      const have=new Set(db.entries.map(e=>e.id));let n=0;
      ok.forEach(e=>{if(!have.has(e.id)){db.entries.push(e);n++}});
      save();render();toast(n+" checks restored");
    }catch(e){toast("Not a Land Check backup")}
  };
  r.readAsText(f);
}

/* ---------- samples ---------- */
function samples(){
  const now=Date.now(), at=(d,h)=>startOfDay(now-d*DAY)+h*36e5;
  const S=[[6,11,"Blue World City","buy","no"],[5,18,"F-11","buy","wait"],[4,13,"Bani Gala","buy","no"],
    [3,16,"Bahria Town Ph 8","buy","no"],[2,12,"G-13","sell","yes"],[1,19,"I-12","buy",null],[0,9,"DHA Phase 2","buy",null]];
  S.forEach(([d,h,n,m,a],i)=>db.entries.push({id:"s"+i,s:1,t:at(d,h),n,m,...(a?{a,at:at(d-1,10)}:{})}));
  save();render();
}


/* ---------- schematic map ---------- */
let mapMode="risk", mapSel=null;
const ROWS="BCDEFGHI", CW=22, CH=26, X0=20, Y0=14;
const cellX=n=>X0+(18-n)*CW, cellY=l=>Y0+ROWS.indexOf(l)*CH;
const OUTER=[["West · M-2 · Airport","M-2 / airport corridor"],["South-east · Expressway","Expressway society"],["South-east · DHA & Bahria","Gated society"],["East · Murree Road","Outskirts / risk"]];
function cls(a){
  if(mapMode==="risk") return a.l==="ok"?"ok":a.l==="verify"?"warn":"bad";
  return a.s>=80?"ok":a.s>=50?"warn":"bad";
}
const cellsOf=a=>[...a.n.matchAll(/\b([B-I])-(\d{1,2})\b/g)].map(m=>[m[1],+m[2]]).filter(([l,n])=>n>=5&&n<=18);
function drawMap(){
  const W=X0+14*CW+28, H=Y0+8*CH+34; let g="";
  for(const l of ROWS){g+=`<text class="ax" x="${X0-8}" y="${cellY(l)+CH/2+3}" text-anchor="middle">${l}</text>`;
    for(let n=5;n<=18;n++) g+=`<rect class="fc" x="${cellX(n)+1}" y="${cellY(l)+1}" width="${CW-2}" height="${CH-2}" rx="3"/>`;}
  for(let n=5;n<=18;n++) g+=`<text class="ax" x="${cellX(n)+CW/2}" y="${Y0-4}" text-anchor="middle">${n}</text>`;
  AREAS.forEach(a=>cellsOf(a).forEach(([l,n])=>{
    g+=`<rect class="dc ${cls(a)}${mapSel===a.n?" sel":""}" data-mn="${a.n}" x="${cellX(n)+1}" y="${cellY(l)+1}" width="${CW-2}" height="${CH-2}" rx="3"/>`+
       `<text class="lb" x="${cellX(n)+CW/2}" y="${cellY(l)+CH/2+3}" text-anchor="middle">${l}-${n}</text>`;}));
  // Blue Area runs along Jinnah Ave between F and G, from 5 to 8
  const by=cellY("G")-6, bx=cellX(8)+2, bw=cellX(5)+CW-2-bx;
  g+=`<rect class="ba" x="${bx}" y="${by}" width="${bw}" height="12" rx="6"/><text class="bat" x="${bx+bw/2}" y="${by+8.5}" text-anchor="middle">BLUE AREA</text>`;
  const rx=X0+14*CW+10;
  g+=`<text class="ar" transform="translate(${rx+4},${cellY("D")}) rotate(90)">East · Murree Rd →</text>`;
  g+=`<text class="ar" x="${rx+6}" y="${by+9}" text-anchor="middle">◆</text>`;
  g+=`<text class="ar" x="${X0}" y="${H-8}">↙ M-2 · Airport</text><text class="ar" x="${W-4}" y="${H-8}" text-anchor="end">Expressway · DHA · Bahria ↘</text>`;
  let h=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Islamabad sector map">${g}</svg>`;
  h+= mapMode==="risk"
    ? `<div class="lg"><span><i style="background:var(--ok)"></i>Approved</span><span><i style="background:var(--warn)"></i>Check first</span><span><i style="background:var(--bad)"></i>Avoid</span><span>◆ Red Zone</span></div>`
    : `<div class="lg"><span><i style="background:var(--ok)"></i>Score 80+</span><span><i style="background:var(--warn)"></i>50–79</span><span><i style="background:var(--bad)"></i>Under 50</span><span>◆ Red Zone</span></div>`;
  for(const [label,grp] of OUTER){
    const list=AREAS.filter(a=>a.g===grp&&!cellsOf(a).length);
    if(!list.length) continue;
    h+=`<div class="d">${label}</div><div class="chips">${list.map(a=>`<button class="chip ${cls(a)}${mapSel===a.n?" sel":""}" data-mn="${a.n}">${a.n}</button>`).join("")}</div>`;
  }
  h+=`<div class="mu" style="margin-top:8px">Not to scale. Positions are approximate, not plot boundaries.</div>`;
  $("map").innerHTML=h;
  document.querySelectorAll("[data-mc]").forEach(b=>b.classList.toggle("g",b.dataset.mc===mapMode));
  const a=byName[mapSel];
  $("mapInfo").innerHTML = a ? (()=>{const v=verdict(a,"buy");return `<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:20px">${a.n}</b><span class="tag ${v.c}">${v.v}</span></div>
    <div class="mu" style="margin:4px 0 10px">${a.r}</div>
    ${priceRows(a)}<div class="ln">${v.y} · ${a.k} km from Blue Area</div><div class="ln">Future score <b>${a.s}</b>/100</div>
    <div class="row" style="margin-top:12px"><button class="btn g" data-chk="buy">Check buy</button><button class="btn" data-chk="sell">Check sell</button></div>`})() : "";
}
document.getElementById("numbers").addEventListener("click",e=>{
  const t=e.target.closest("[data-mn],[data-mc],[data-chk]"); if(!t) return;
  if(t.dataset.mc){mapMode=t.dataset.mc;drawMap();return}
  if(t.dataset.chk){mode=t.dataset.chk;check(mapSel);return}
  mapSel=t.dataset.mn;drawMap();
  if(window.matchMedia&&!matchMedia("(prefers-reduced-motion: reduce)").matches) $("mapInfo").scrollIntoView({behavior:"smooth",block:"nearest"});
});

/* ---------- events ---------- */
document.querySelector("nav").addEventListener("click",e=>{
  const s=e.target.dataset.s;if(!s)return;
  document.querySelectorAll(".scr").forEach(x=>x.classList.toggle("on",x.id===s));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  scrollTo(0,0);
});
$("go").onclick=openPick;
$("close").onclick=()=>$("pick").classList.remove("on");
$("done").onclick=()=>$("res").classList.remove("on");
$("pickBody").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.m){mode=b.dataset.m;showAreas()}
  else if(b.dataset.n) check(b.dataset.n);
});
document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.a){const x=db.entries.find(e=>e.id===b.dataset.id);x.a=b.dataset.a;x.at=Date.now();save();render();
    toast(b.dataset.a==="no"&&isRisky(x)?"Dodged. Counted.":"Noted")}
  if(b.dataset.look){setLook(b.dataset.look);return}
  if(b.id==="clr2"||b.id==="smp"){
    if(db.entries.some(e=>e.s)){db.entries=db.entries.filter(e=>!e.s);save();render();toast("Samples cleared")}
    else samples();
  }
});

const LOOK_BG={neu:"#262a31",bru:"#0b0b0b",min:"#0e0f11",glass:"#141824",ret:"#040904",day:"#f6f4ef"};
function setLook(t){document.documentElement.dataset.t=t;try{localStorage.setItem("landcheck.look",t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=LOOK_BG[t];
  document.querySelectorAll("[data-look]").forEach(b=>b.classList.toggle("g",b.dataset.look===t));}
setLook(document.documentElement.dataset.t in LOOK_BG?document.documentElement.dataset.t:"neu");
$("bk").onclick=backup;
$("rs").onclick=()=>$("file").click();
$("file").onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=""};

if(!db){db={entries:[]};samples()} else render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
