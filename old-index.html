:root{--bg:#111418;--card:#1a1e24;--line:#2a3038;--tx:#e8eaed;--mu:#8b939c;--ok:#78be96;--warn:#e0b25c;--bad:#e07a6e;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}

h1{font-size:22px;margin:4px 0 16px;font-weight:600}
h2{font-size:14px;color:var(--mu);font-weight:500;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{display:none}.scr.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.big{font-size:64px;font-weight:600;line-height:1;margin:6px 0}
.mu{color:var(--mu);font-size:15px}
.main{display:block;width:100%;min-height:72px;border-radius:var(--r);background:var(--ok);color:#0d1a12;font-size:21px;font-weight:600;margin:16px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{min-height:56px;border-radius:14px;background:var(--line);font-size:17px;padding:0 12px}
.btn.g{background:var(--ok);color:#0d1a12;font-weight:600}
.btn.s{background:transparent;border:1px solid var(--line);color:var(--mu);min-height:48px;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(17,20,24,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;background:none;color:var(--mu);font-size:15px}
nav button.on{color:var(--tx);font-weight:600}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none}
.sheet.on{display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x{min-width:56px;min-height:48px;background:var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{min-height:52px;background:var(--card);border-radius:12px;padding:6px 10px;text-align:left;font-size:16px}
.grid button i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
input[type=search]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;padding:0 14px;margin-bottom:4px}
.v{font-size:34px;font-weight:700;margin:4px 0 2px}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.bad{color:var(--bad)}.v.n{color:var(--tx)}
.ln{padding:6px 0;border-top:1px solid var(--line)}.ln:first-of-type{border:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border:0}
.tag{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.sc{font-weight:600;font-variant-numeric:tabular-nums}
.d{margin:16px 0 4px;color:var(--mu);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.link{background:none;color:var(--mu);text-decoration:underline;font-size:14px;min-height:44px;padding:0}

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.entries))return d}catch(e){}return null}
let db = load();
function save(){try{localStorage.setItem(KEY, JSON.stringify(db))}catch(e){toast("Could not save")}}

function money(v){return v>=1e7?(v/1e7).toFixed(v>=1e8?0:1)+" cr":Math.round(v/1e5)+" lakh"}
function price(a){
  if(!a.lo) return "No price data";
  const lo=a.lo*225, hi=a.hi*225;
  return (lo===hi?money(lo):money(lo)+" – "+money(hi))+" / marla"+(a.h?" (built)":"");
}
function verdict(a, mode){
  const y = a.y!=null ? (a.y>=0?"+":"")+a.y+"% in a year" : "No yearly data";
  if(mode==="buy"){
    if(a.l==="risk") return {v:"Avoid",c:"bad",why:"Title or approval problems reported",next:"Walk away, or see a lawyer first",y};
    if(a.l==="verify") return {v:"Check first",c:"warn",why:"Some files or blocks not approved",next:"Get NOC proof. Check the CDA illegal list.",y};
    return {v:"Safe area",c:"ok",why:"Approved area. Seller still needs checking.",next:"Verify transfer at the CDA or society office",y};
  }
  if(a.l==="risk") return {v:"Sell soon",c:"warn",why:"Legal risk weighs on future value",next:"Take bank transfer or pay order only",y};
  if((a.y||0)>=10 && a.l==="ok") return {v:"Hold if you can",c:"ok",why:"Still rising fast",next:"If selling, ask the top of the range",y};
  return {v:"Fair to sell",c:"n",why:"Steady prices here",next:"Take bank transfer or pay order only",y};
}
const isRisky = e => e.m==="buy" && byName[e.n] && byName[e.n].l!=="ok";
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return +d}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),1600)}

/* ---------- render ---------- */
function render(){
  const E = db.entries;
  $("dodged").textContent = E.filter(e=>isRisky(e)&&e.a==="no").length;
  const wk = E.filter(e=>e.t>Date.now()-7*DAY).length;
  const flagged = E.filter(isRisky).length;
  $("week").textContent = wk+" checks this week · "+flagged+" risky flagged";

  // one follow-up question, next day
  const today = startOfDay(Date.now());
  const q = E.filter(e=>(!e.a||(e.a==="wait"&&e.at<today)) && e.t<today).sort((a,b)=>b.t-a.t)[0];
  $("ask").innerHTML = q ? `<div class="card"><div class="mu">${ago(q.t)}</div>
    <div style="font-size:20px;margin:4px 0 14px">Did you ${q.m} in ${q.n}?</div>
    <div class="row"><button class="btn" data-a="yes" data-id="${q.id}">Yes</button><button class="btn" data-a="no" data-id="${q.id}">No</button><button class="btn" data-a="wait" data-id="${q.id}">Not yet</button></div></div>` : "";

  const hasS = E.some(e=>e.s);
  $("sampleNote").innerHTML = hasS ? `<button class="link" id="clr2">Showing sample week · Clear samples</button>` : "";
  $("smp").textContent = hasS ? "Clear samples" : "Load samples";

  // history
  const H = [...E].sort((a,b)=>b.t-a.t);
  $("hist").innerHTML = H.length ? H.map(e=>{
    const a=byName[e.n], v=a?verdict(a,e.m):{v:"?",c:""};
    const out = e.a==="yes"?(e.m==="buy"?"Bought":"Sold"):e.a==="no"?"Didn't":e.a==="wait"?"Not yet":"";
    return `<div class="it"><div><div>${e.n} <span class="mu">· ${e.m==="buy"?"Buy":"Sell"}</span></div>
      <div class="mu">${ago(e.t)}${out?" · "+out:""}</div></div><span class="tag ${v.c}">${v.v}</span></div>`;
  }).join("") : `<div class="mu">No checks yet</div>`;

  // numbers
  $("asof").textContent = "Prices as of "+DATA_DATE+" · asking prices";
  const ranked = AREAS.filter(a=>a.lo).sort((a,b)=>b.s-a.s);
  const li = a => `<div class="it"><div><div>${a.n}</div><div class="mu">${a.r}</div></div><span class="sc">${a.s}</span></div>`;
  $("best").innerHTML = ranked.slice(0,3).map(li).join("");
  $("worst").innerHTML = ranked.slice(-3).reverse().map(li).join("");
  const buys=E.filter(e=>e.m==="buy").length;
  const yes=E.filter(e=>e.a==="yes").length;
  $("mine").innerHTML = `<div class="it"><span>Checks</span><span class="sc">${E.length}</span></div>
    <div class="it"><span>Buy / Sell</span><span class="sc">${buys} / ${E.length-buys}</span></div>
    <div class="it"><span>Risky flagged</span><span class="sc">${flagged}</span></div>
    <div class="it"><span>Deals done</span><span class="sc">${yes}</span></div>`;
}
function ago(t){
  const d = Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  return d===0?"Today":d===1?"Yesterday":d+" days ago";
}

/* ---------- check flow: 2 inputs ---------- */
let mode=null;
function openPick(){
  mode=null;
  $("pickT").textContent="Buying or selling?";
  $("pickBody").innerHTML=`<div class="row" style="margin-top:30px"><button class="btn g" style="min-height:96px;font-size:22px" data-m="buy">Buy</button><button class="btn" style="min-height:96px;font-size:22px" data-m="sell">Sell</button></div>`;
  $("pick").classList.add("on");
}
function showAreas(){
  $("pickT").textContent = mode==="buy"?"Buy where?":"Sell where?";
  const recent=[...new Set([...db.entries].sort((a,b)=>b.t-a.t).map(e=>e.n))].filter(n=>byName[n]).slice(0,4);
  const groups={};AREAS.forEach(a=>(groups[a.g]=groups[a.g]||[]).push(a));
  const btn=a=>`<button data-n="${a.n}">${a.n}<i>${a.lo?money(a.lo*225):"–"}</i></button>`;
  let h=`<input type="search" id="q" placeholder="Find area" autocomplete="off">`;
  if(recent.length) h+=`<div class="d">Recent</div><div class="grid">${recent.map(n=>btn(byName[n])).join("")}</div>`;
  for(const g in groups) h+=`<div class="d" data-g>${g}</div><div class="grid">${groups[g].map(btn).join("")}</div>`;
  $("pickBody").innerHTML=h;
  $("q").addEventListener("input",e=>{
    const s=e.target.value.toLowerCase();
    $("pickBody").querySelectorAll(".grid button").forEach(b=>b.style.display=b.dataset.n.toLowerCase().includes(s)?"":"none");
  });
}
function check(name){
  const a=byName[name], v=verdict(a,mode);
  db.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),n:name,m:mode});
  save();
  $("pick").classList.remove("on");
  $("resT").textContent=(mode==="buy"?"Buy":"Sell")+" · "+name;
  $("resBody").innerHTML=`<div class="v ${v.c}">${v.v}</div><div class="mu" style="margin-bottom:14px">${v.why}</div>
    <div class="ln"><b>${price(a)}</b></div>
    <div class="ln">${v.y}</div>
    <div class="ln">${a.k} km from Blue Area</div>
    <div class="ln">Future score <b>${a.s}</b>/100</div>
    <div class="ln" style="color:var(--${v.c==="bad"?"bad":v.c==="warn"?"warn":"tx"})">→ ${v.next}</div>`;
  $("res").classList.add("on");
  render();
}

/* ---------- backup / restore ---------- */
async function backup(){
  const txt=JSON.stringify({app:"landcheck",v:1,saved:new Date().toISOString(),entries:db.entries},null,1);
  const name="land-check-backup-"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([txt],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return} }catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("Backup saved");
}
function restore(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=="landcheck"||!Array.isArray(d.entries)) throw 0;
      const ok=d.entries.filter(e=>e&&e.id&&e.t&&e.n&&(e.m==="buy"||e.m==="sell"));
      const have=new Set(db.entries.map(e=>e.id));let n=0;
      ok.forEach(e=>{if(!have.has(e.id)){db.entries.push(e);n++}});
      save();render();toast(n+" checks restored");
    }catch(e){toast("Not a Land Check backup")}
  };
  r.readAsText(f);
}

/* ---------- samples ---------- */
function samples(){
  const now=Date.now(), at=(d,h)=>startOfDay(now-d*DAY)+h*36e5;
  const S=[[6,11,"Blue World City","buy","no"],[5,18,"F-11","buy","wait"],[4,13,"Bani Gala","buy","no"],
    [3,16,"Bahria Town Ph 8","buy","no"],[2,12,"G-13","sell","yes"],[1,19,"I-12","buy",null],[0,9,"DHA Phase 2","buy",null]];
  S.forEach(([d,h,n,m,a],i)=>db.entries.push({id:"s"+i,s:1,t:at(d,h),n,m,...(a?{a,at:at(d-1,10)}:{})}));
  save();render();
}

/* ---------- events ---------- */
document.querySelector("nav").addEventListener("click",e=>{
  const s=e.target.dataset.s;if(!s)return;
  document.querySelectorAll(".scr").forEach(x=>x.classList.toggle("on",x.id===s));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  scrollTo(0,0);
});
$("go").onclick=openPick;
$("close").onclick=()=>$("pick").classList.remove("on");
$("done").onclick=()=>$("res").classList.remove("on");
$("pickBody").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.m){mode=b.dataset.m;showAreas()}
  else if(b.dataset.n) check(b.dataset.n);
});
document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.a){const x=db.entries.find(e=>e.id===b.dataset.id);x.a=b.dataset.a;x.at=Date.now();save();render();
    toast(b.dataset.a==="no"&&isRisky(x)?"Dodged. Counted.":"Noted")}
  if(b.id==="clr2"||b.id==="smp"){
    if(db.entries.some(e=>e.s)){db.entries=db.entries.filter(e=>!e.s);save();render();toast("Samples cleared")}
    else samples();
  }
});
$("bk").onclick=backup;
$("rs").onclick=()=>$("file").click();
$("file").onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=""};

if(!db){db={entries:[]};samples()} else render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
